name: terraform-pr

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - "modules/**"
      - "environments/**"
      - "bootstrap/**"
      - ".tflint.hcl"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: "1.9.8"

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          for dir in bootstrap infra modules/network modules/container_app; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  plan:
    needs: static-checks
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, qa, prod]
    uses: ./.github/workflows/terraform-run.yml
    with:
      environment: ${{ matrix.environment }}
    secrets: inherit
